services:
  vlc-telnet:
    image: ne1ver/vlc-telnet:latest
    container_name: vlc-telnet
    ports:
      - "4212:4212"
    devices:
      - "/dev/snd:/dev/snd"
    environment:
      VLC_TELNET_PASSWORD: ${VLC_TELNET_PASSWORD}
      ALSA_DEVICE: ${ALSA_DEVICE:-USB Audio}
    restart: unless-stopped
